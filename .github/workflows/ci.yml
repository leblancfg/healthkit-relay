name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest Go, for the newest standard library security fixes; go.mod states the minimum.
          go-version: stable
          check-latest: true
          cache-dependency-path: server/go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::not gofmt-ed: $unformatted"; exit 1; fi
      - run: go vet ./...
      - name: go test -race
        # The race detector needs cgo; the shipped binary does not.
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: go test -run Memory
        # Heap bounds, measured without the race detector (the race run skips them).
        run: go test -count=1 -run Memory ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          working-directory: server
          install-go: false
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: server
          go-version-input: stable
          check-latest: true
      - name: Build (static)
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o healthkit-relay . && ./healthkit-relay -version
      - name: Healthcheck helper
        working-directory: docker/healthcheck
        run: go vet ./... && go build -o /dev/null .

  demo:
    name: Demo server (Worker, contract test)
    # The public demo server is a Cloudflare Worker (demo/worker). The contract test runs the
    # same requests against the Go server's demo mode (the job above) and against the Worker,
    # here under wrangler dev, so the two cannot drift apart.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: server/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/worker/package-lock.json
      - name: npm ci, Worker tests
        working-directory: demo/worker
        run: npm ci --no-audit --no-fund && npm test
      - name: Contract test against the Worker
        working-directory: demo/worker
        run: |
          printf 'DEMO_CODE=ABCD-EFGH-JKLM-NPQR\nDEMO_KEY=%s\n' "$(openssl rand -hex 32)" > .dev.vars
          npx wrangler dev --port 8787 --ip 127.0.0.1 --var DEMO_QUOTA:1048576 --var MAX_BODY_BYTES:131072 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for _ in $(seq 90); do curl -sf http://127.0.0.1:8787/healthz >/dev/null && break; sleep 1; done
          cd ../../server
          HKR_DEMO_URL=http://127.0.0.1:8787 HKR_DEMO_CODE=ABCD-EFGH-JKLM-NPQR HKR_DEMO_PUBLIC_URL=https://health-relay-demo.leblancfg.com \
            HKR_DEMO_QUOTA=1048576 HKR_DEMO_MAX_BODY=131072 go test -count=1 -v -run TestDemoContract . ||
            { tail -50 "$RUNNER_TEMP/wrangler.log"; exit 1; }

  scripts:
    name: Shell, workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh ios/Scripts/ui-test
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  ios:
    name: iOS (build, unit tests)
    # The app uses iOS 27 SDK APIs, so it needs Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Generate the HealthKit type list from this SDK
        # Every build does this too (project.yml); here it shows in the log whether the
        # committed file matches this Xcode's SDK.
        run: |
          xcrun python3 -I Scripts/gen-health-types HealthKitRelay/Generated/SDKHealthTypes.swift
          git diff --stat --exit-code -- HealthKitRelay/Generated ||
            echo "::notice::Generated/SDKHealthTypes.swift differs from what $(xcodebuild -version | head -1) generates; commit it after updating Xcode"
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = null ]; then
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build for device (unsigned)
        run: |
          mkdir -p build
          xcodebuild build -project HealthKitRelay.xcodeproj -scheme HealthKitRelay \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO | tee build/device-build.log | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build/device-build.log
      - name: Unit tests (simulator)
        run: |
          xcodebuild test -project HealthKitRelay.xcodeproj -scheme HealthKitRelay \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -resultBundlePath build/unit.xcresult -only-testing:HealthKitRelayTests \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            > build/unit-test.log 2>&1 || { tail -80 build/unit-test.log; exit 1; }
          grep -E 'error:|Test Suite .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)' build/unit-test.log
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ios/build/*.log
            ios/build/unit.xcresult
          retention-days: 7
