# Release binaries for tags: goreleaser release --clean (the release workflow does this).
# Try locally: goreleaser release --snapshot --clean (writes dist/).
version: 2
project_name: healthkit-relay

builds:
  - id: healthkit-relay
    dir: server
    main: .
    binary: healthkit-relay
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - server/README.md
      - packaging/healthkit-relay.service

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^ci:"]

release:
  draft: false
  prerelease: auto
