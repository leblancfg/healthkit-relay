# healthkit-relay with Docker Compose. See docs/setup/docker.md. In this directory:
#
#   mkdir -p data
#   (umask 077; head -c 32 /dev/urandom | base64 > token)
#   printf 'HKR_USER=%s\nHKR_PUBLIC_URL=%s\n' "$(id -u):$(id -g)" http://192.168.1.10:8080 > .env
#   docker compose up -d
#   docker compose exec relay healthkit-relay pair      # QR code for the iPhone app
#
# The server runs as HKR_USER, so ./data and ./token stay owned by you (and backed up with
# the rest of this directory). HKR_PUBLIC_URL is the address phones use to reach it.
#
# Optional dashboards: add HKR_FORWARD_URL=http://victoriametrics:8428/influx/write to .env,
# then `docker compose --profile metrics up -d`; Grafana is on http://localhost:3000.

services:
  relay:
    image: ghcr.io/leblancfg/healthkit-relay:${HKR_VERSION:-latest}
    build: .
    restart: unless-stopped
    user: ${HKR_USER:?set HKR_USER=uid:gid in .env (see the top of docker-compose.yml)}
    ports:
      - ${HKR_PORT:-8080}:8080
    environment:
      HKR_PUBLIC_URL: ${HKR_PUBLIC_URL:?set HKR_PUBLIC_URL in .env, the URL phones use to reach this server}
      HKR_FORWARD_URL: ${HKR_FORWARD_URL:-}
    volumes:
      - ./data:/data
      - ./token:/run/secrets/hkr_token:ro

  victoriametrics:
    profiles: [metrics]
    image: victoriametrics/victoria-metrics:latest
    restart: unless-stopped
    command: [-storageDataPath=/storage, -retentionPeriod=100y]
    volumes:
      - victoriametrics:/storage

  grafana:
    profiles: [metrics]
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports:
      - ${GRAFANA_PORT:-3000}:3000
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/victoriametrics.yml
    volumes:
      - grafana:/var/lib/grafana

configs:
  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          url: http://victoriametrics:8428
          isDefault: true

volumes:
  victoriametrics:
  grafana:
