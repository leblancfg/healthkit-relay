# XcodeGen spec: `make ios-project` (or `xcodegen generate` in this directory) writes
# HealthKitRelay.xcodeproj, which is not checked in.
# Signing identity and bundle id come from Config/App.xcconfig, overridden by the
# gitignored Config/Local.xcconfig (copy Config/Local.xcconfig.example).
name: HealthKitRelay
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HealthKitRelay:
    type: application
    platform: iOS
    sources:
      - path: HealthKitRelay
    info:
      path: HealthKitRelay/Info.plist
      properties:
        CFBundleDisplayName: Health Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Health Relay reads your health data to copy it to your own server.
        NSHealthUpdateUsageDescription: Health Relay never writes health data.
    entitlements:
      path: HealthKitRelay/HealthKitRelay.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HKR_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(HKR_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
  HealthKitRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthKitRelayTests
    dependencies:
      - target: HealthKitRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HKR_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(HKR_TEAM_ID)
        GENERATE_INFOPLIST_FILE: true
schemes:
  HealthKitRelay:
    build:
      targets:
        HealthKitRelay: all
    test:
      targets:
        - HealthKitRelayTests
