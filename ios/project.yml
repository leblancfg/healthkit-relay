# XcodeGen spec: `make ios-project` (or `xcodegen generate` in this directory) writes
# HealthKitRelay.xcodeproj, which is not checked in.
# Signing identity and bundle id come from Config/App.xcconfig, overridden by the
# gitignored Config/Local.xcconfig (copy Config/Local.xcconfig.example).
name: HealthKitRelay
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "14"
targets:
  HealthKitRelay:
    type: application
    platform: iOS
    sources:
      - path: HealthKitRelay
    # The list of HealthKit types is generated from the SDK of the Xcode doing the build, so a
    # newer Xcode syncs the types it adds with no code change. The generated file is committed,
    # so a machine without python3 still builds (with that file's types).
    preBuildScripts:
      - name: Generate HealthKit types from the SDK
        basedOnDependencyAnalysis: false
        script: |
          if /usr/bin/xcrun --find python3 >/dev/null 2>&1; then
            /usr/bin/xcrun python3 -I "$SRCROOT/Scripts/gen-health-types" "$SRCROOT/HealthKitRelay/Generated/SDKHealthTypes.swift"
          else
            echo "warning: python3 not found; using the committed Generated/SDKHealthTypes.swift"
          fi
    info:
      path: HealthKitRelay/Info.plist
      properties:
        CFBundleDisplayName: Health Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Setup links from the server: healthrelay://pair?server=…&code=…
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).pair
            CFBundleURLSchemes: [healthrelay]
        # Servers on a home network often have no TLS certificate: plain HTTP is allowed to
        # local addresses (IPs, .local and single-label names) only; everything else is HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Shown when the app first reaches a server on the local network.
        NSLocalNetworkUsageDescription: Health Relay connects to the server you set up on your local network, for example a computer at home at 192.168.1.10, to send it your Health data.
        # Only HTTPS through the system's URL loading (exempt from export documentation).
        ITSAppUsesNonExemptEncryption: false
        # The app reads Health data and does nothing else.
        UIRequiredDeviceCapabilities: [healthkit]
        # Background app refresh (fetch) and the catch-up while charging (processing), fallbacks
        # for HealthKit background delivery (ScheduledTask); continued syncs the user started
        # (iOS 26, ContinuedSync) use identifiers under .continued.*.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
          - $(PRODUCT_BUNDLE_IDENTIFIER).catchup
          - $(PRODUCT_BUNDLE_IDENTIFIER).continued.*
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Health Relay reads the Health data you allow and copies it to the server you set up, such as a computer at home, so you keep a copy of your history that you control.
        NSHealthUpdateUsageDescription: Health Relay reads Health data to copy it to your server, and leaves the data in Health as it is.
        # Builds that read Health Records (HKR_HEALTH_RECORDS, see README.md) add:
        # NSHealthClinicalHealthRecordsShareUsageDescription: Health Relay reads your health records and copies them to your own server.
    entitlements:
      path: HealthKitRelay/HealthKitRelay.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Builds that read Health Records add: com.apple.developer.healthkit.access: [health-records]
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HKR_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(HKR_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: HealthKitRelay/Support/HealthKitRelay-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # HKR_HEALTH_RECORDS (in HKR_SWIFT_CONDITIONS, Config/App.xcconfig) reads Health Records.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(HKR_SWIFT_CONDITIONS)
  HealthKitRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthKitRelayTests
    dependencies:
      - target: HealthKitRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HKR_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(HKR_TEAM_ID)
        GENERATE_INFOPLIST_FILE: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(HKR_SWIFT_CONDITIONS)
  # The setup flow end to end (setup page, link, Health sheet, sync, screenshots). Needs a
  # running server: Scripts/ui-test starts one and passes its setup page in
  # TEST_RUNNER_HKR_SETUP_URL; without it the test is skipped.
  HealthKitRelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthKitRelayUITests
    dependencies:
      - target: HealthKitRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HKR_BUNDLE_ID).uitests
        DEVELOPMENT_TEAM: $(HKR_TEAM_ID)
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: HealthKitRelay
schemes:
  HealthKitRelay:
    build:
      targets:
        HealthKitRelay: all
    test:
      targets:
        - HealthKitRelayTests
        - HealthKitRelayUITests
